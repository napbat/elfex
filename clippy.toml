# Public API is linted like private code; breaking fixes ship in a new release.
avoid-breaking-exported-api = false
# Product and architecture names that are prose, not code identifiers.
doc-valid-idents = [
    "AArch64",
    "ARCompact",
    "LoongArch",
    "MicroBlaze",
    "OpenRISC",
    "PowerPC",
    "PowerPC64",
    "RISC-V",
    "SPARC",
    "SysV",
    "x86-64",
    "..",
]
