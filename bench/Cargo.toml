# Taplo 0.9 cannot resolve SchemaStore's split Cargo lint schemas.
#:schema https://raw.githubusercontent.com/SchemaStore/schemastore/cf458e6e33141d3a0506f24279de79eeeeb5130a/src/schemas/json/cargo.json

[package]
name = "elfex-bench"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
elfex = { path = ".." }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[lints.rust]
warnings = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
# Denied everywhere. The exception is the counting allocator of the `memory` binary; its
# unsafe items are marked with `#[expect(unsafe_code)]` and documented with their invariants.
unsafe_code = "deny"

[lints.clippy]
allow_attributes = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
# Modules live in `foo.rs` with their children in `foo/`, never in
# `foo/mod.rs` (the Rust Reference's recommended layout); integration test
# crates with several files use `tests/<name>/main.rs`.
mod_module_files = "deny"

[lints.rustdoc]
all = { level = "warn", priority = -1 }

[lib]
bench = false

[[bench]]
name = "elfex"
harness = false

[[bin]]
name = "memory"
path = "src/bin/memory.rs"
test = false
bench = false
